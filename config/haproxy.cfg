# Routes PostgreSQL traffic by Patroni role and dynamically tracks container addresses through Docker DNS.
global
    log stdout format raw local0
    maxconn 2048

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 1m
    timeout server 1m

# Docker may assign a new IP when a Patroni container is recreated. Runtime DNS
# resolution keeps each HAProxy server label attached to the correct container.
resolvers docker
    nameserver docker_dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold other 10s
    hold refused 10s
    hold nx 10s
    hold timeout 10s
    hold valid 10s
    hold obsolete 10s

frontend postgres_write
    bind *:5432
    default_backend postgres_primary

backend postgres_primary
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 2s fall 3 rise 2 on-marked-down shutdown-sessions
    server patroni1 patroni1:5432 check port 8008 resolvers docker resolve-prefer ipv4 init-addr last,libc,none
    server patroni2 patroni2:5432 check port 8008 resolvers docker resolve-prefer ipv4 init-addr last,libc,none
    server patroni3 patroni3:5432 check port 8008 resolvers docker resolve-prefer ipv4 init-addr last,libc,none

frontend postgres_read
    bind *:5433
    default_backend postgres_replicas

backend postgres_replicas
    balance roundrobin
    option httpchk GET /replica?lag=16MB
    http-check expect status 200
    default-server inter 2s fall 3 rise 2 on-marked-down shutdown-sessions
    server patroni1 patroni1:5432 check port 8008 resolvers docker resolve-prefer ipv4 init-addr last,libc,none
    server patroni2 patroni2:5432 check port 8008 resolvers docker resolve-prefer ipv4 init-addr last,libc,none
    server patroni3 patroni3:5432 check port 8008 resolvers docker resolve-prefer ipv4 init-addr last,libc,none

listen statistics
    mode http
    bind *:7000
    stats enable
    stats uri /
    stats refresh 5s
