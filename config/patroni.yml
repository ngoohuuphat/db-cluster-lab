# Configures Patroni bootstrap, replication, authentication, and node health behavior for the PostgreSQL cluster.
scope: db-lab
namespace: /service/
name: node-name-is-overridden-by-environment

restapi:
  listen: 0.0.0.0:8008
  connect_address: node-name-is-overridden-by-environment:8008

etcd3:
  hosts:
    - etcd1:2379
    - etcd2:2379
    - etcd3:2379

bootstrap:
  dcs:
    ttl: 30
    loop_wait: 10
    retry_timeout: 10
    maximum_lag_on_failover: 1048576
    postgresql:
      use_pg_rewind: true
      use_slots: true
      parameters:
        hot_standby: "on"
        max_connections: 100
        max_replication_slots: 10
        max_wal_senders: 10
        password_encryption: scram-sha-256
        wal_keep_size: 128MB
        wal_level: replica
  initdb:
    - encoding: UTF8
    - data-checksums
  pg_hba:
    - local all all trust
    - host all all 0.0.0.0/0 scram-sha-256
    - host replication replicator 0.0.0.0/0 scram-sha-256

postgresql:
  listen: 0.0.0.0:5432
  connect_address: node-name-is-overridden-by-environment:5432
  data_dir: /var/lib/postgresql/data/pgdata
  bin_dir: /usr/lib/postgresql/17/bin
  pgpass: /var/lib/postgresql/.pgpass
  authentication:
    superuser:
      username: postgres
      password: overridden-by-environment
    replication:
      username: replicator
      password: overridden-by-environment
    rewind:
      username: rewind_user
      password: overridden-by-environment
  parameters:
    unix_socket_directories: /var/run/postgresql

watchdog:
  mode: "off"

tags:
  clonefrom: true
  failover_priority: 1
  noloadbalance: false
  nosync: false
