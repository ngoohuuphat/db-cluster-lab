# Defines a local three-node PostgreSQL HA cluster, a three-node etcd quorum, and HAProxy routing endpoints.
x-etcd-common: &etcd-common
  image: gcr.io/etcd-development/etcd:v3.5.30
  restart: unless-stopped
  networks:
    - db-lab
  environment:
    ETCDCTL_API: "3"
    ETCD_INITIAL_CLUSTER: etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
    ETCD_INITIAL_CLUSTER_STATE: new
    ETCD_INITIAL_CLUSTER_TOKEN: db-lab-etcd
    ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
    ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
  healthcheck:
    test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
    interval: 5s
    timeout: 3s
    retries: 12

x-patroni-common: &patroni-common
  build:
    context: .
    args:
      PATRONI_VERSION: 4.1.3
  image: db-cluster-lab/patroni-postgres:17.10
  restart: unless-stopped
  networks:
    - db-lab
  depends_on:
    etcd1:
      condition: service_healthy
    etcd2:
      condition: service_healthy
    etcd3:
      condition: service_healthy
  environment: &patroni-environment
    PATRONI_SCOPE: db-lab
    PATRONI_NAMESPACE: /service/
    PATRONI_ETCD3_HOSTS: etcd1:2379,etcd2:2379,etcd3:2379
    PATRONI_POSTGRESQL_DATA_DIR: /var/lib/postgresql/data/pgdata
    PATRONI_POSTGRESQL_PGPASS: /var/lib/postgresql/.pgpass
    PATRONI_SUPERUSER_USERNAME: postgres
    PATRONI_SUPERUSER_PASSWORD: ${POSTGRES_PASSWORD:-lab-postgres}
    PATRONI_REPLICATION_USERNAME: replicator
    PATRONI_REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-lab-replicator}
    PATRONI_REWIND_USERNAME: rewind_user
    PATRONI_REWIND_PASSWORD: ${REWIND_PASSWORD:-lab-rewind}
  volumes:
    - ./config/patroni.yml:/etc/patroni/patroni.yml:ro
  healthcheck:
    test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8008/liveness"]
    interval: 5s
    timeout: 3s
    retries: 20
    start_period: 20s

services:
  etcd1:
    <<: *etcd-common
    hostname: etcd1
    command:
      - /usr/local/bin/etcd
      - --name=etcd1
      - --data-dir=/etcd-data
      - --advertise-client-urls=http://etcd1:2379
      - --initial-advertise-peer-urls=http://etcd1:2380
    volumes:
      - etcd1-data:/etcd-data

  etcd2:
    <<: *etcd-common
    hostname: etcd2
    command:
      - /usr/local/bin/etcd
      - --name=etcd2
      - --data-dir=/etcd-data
      - --advertise-client-urls=http://etcd2:2379
      - --initial-advertise-peer-urls=http://etcd2:2380
    volumes:
      - etcd2-data:/etcd-data

  etcd3:
    <<: *etcd-common
    hostname: etcd3
    command:
      - /usr/local/bin/etcd
      - --name=etcd3
      - --data-dir=/etcd-data
      - --advertise-client-urls=http://etcd3:2379
      - --initial-advertise-peer-urls=http://etcd3:2380
    volumes:
      - etcd3-data:/etcd-data

  patroni1:
    <<: *patroni-common
    hostname: patroni1
    environment:
      <<: *patroni-environment
      PATRONI_NAME: patroni1
      PATRONI_RESTAPI_CONNECT_ADDRESS: patroni1:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: patroni1:5432
    ports:
      - "127.0.0.1:8001:8008"
    volumes:
      - ./config/patroni.yml:/etc/patroni/patroni.yml:ro
      - patroni1-data:/var/lib/postgresql/data

  patroni2:
    <<: *patroni-common
    hostname: patroni2
    environment:
      <<: *patroni-environment
      PATRONI_NAME: patroni2
      PATRONI_RESTAPI_CONNECT_ADDRESS: patroni2:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: patroni2:5432
    ports:
      - "127.0.0.1:8002:8008"
    volumes:
      - ./config/patroni.yml:/etc/patroni/patroni.yml:ro
      - patroni2-data:/var/lib/postgresql/data

  patroni3:
    <<: *patroni-common
    hostname: patroni3
    environment:
      <<: *patroni-environment
      PATRONI_NAME: patroni3
      PATRONI_RESTAPI_CONNECT_ADDRESS: patroni3:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: patroni3:5432
    ports:
      - "127.0.0.1:8003:8008"
    volumes:
      - ./config/patroni.yml:/etc/patroni/patroni.yml:ro
      - patroni3-data:/var/lib/postgresql/data

  haproxy:
    image: haproxy:3.2.21-alpine
    restart: unless-stopped
    networks:
      - db-lab
    depends_on:
      patroni1:
        condition: service_healthy
      patroni2:
        condition: service_healthy
      patroni3:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WRITE_PORT:-15432}:5432"
      - "127.0.0.1:${READ_PORT:-15433}:5433"
      - "127.0.0.1:7000:7000"
    volumes:
      - ./config/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    healthcheck:
      test: ["CMD", "haproxy", "-c", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
      interval: 10s
      timeout: 3s
      retries: 5

  client:
    image: postgres:17.10-bookworm
    profiles:
      - tools
    networks:
      - db-lab
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-lab-postgres}
    entrypoint: ["psql"]

networks:
  db-lab:
    name: db-cluster-lab

volumes:
  etcd1-data:
  etcd2-data:
  etcd3-data:
  patroni1-data:
  patroni2-data:
  patroni3-data:
